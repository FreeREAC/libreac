name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    # A backstop only: every test already carries its own timeout (tests/run-test.sh),
    # so a hang reds its test in minutes instead of stalling the job for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # reac-protocol, pinned, beside the tree where the Makefile looks for it (REAC_PROTOCOL ?= ../reac-protocol):
      # without it `make facts-drift-check` compares nothing. REAC_REQUIRE_FACTS_GATE=1 makes a skip a failure.
      - name: Fetch reac-protocol (the facts the drift gate compares against)
        run: |
          set -eux
          git init -q ../reac-protocol
          git -C ../reac-protocol fetch -q --depth 1 https://github.com/FreeREAC/reac-protocol.git 3713dca9969733abbd8032329a7d0eb979a67250
          git -C ../reac-protocol checkout -q FETCH_HEAD
          python3 -c 'import yaml' || sudo apt-get install -y -q python3-yaml
      - name: Build + unit tests
        run: make test SANITIZE=1 REAC_REQUIRE_FACTS_GATE=1
      # The transport suite. Its namespace/veth test
      # either measures on this runner or exits 77 and is reported as SKIP: it ends with a
      # verdict either way, and every test in it carries tests/run-test.sh's timeout.
      - name: Transport tests
        run: make test-transport

  # The same two suites in a Fedora container of each release the RPMs are built for (the shared build-rpm
  # workflow's 44 and 45): the Ubuntu job above proves the sources, this proves the release's own target, its
  # compiler and its libc. The container is --privileged because the transport suite mints user and net
  # namespaces and veth pairs, which Docker's default seccomp profile refuses; the runner's kernel modules a
  # namespace may not autoload are loaded on the host first, by name.
  test-fedora:
    name: test (fedora ${{ matrix.fedora }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fedora: [44, 45]
    steps:
      - uses: actions/checkout@v4
      # reac-protocol, pinned, beside the tree where the Makefile looks for it (mounted into the container below):
      # without it `make facts-drift-check` compares nothing. REAC_REQUIRE_FACTS_GATE=1 makes a skip a failure.
      - name: Fetch reac-protocol (the facts the drift gate compares against)
        run: |
          set -eux
          git init -q $RUNNER_TEMP/reac-protocol
          git -C $RUNNER_TEMP/reac-protocol fetch -q --depth 1 https://github.com/FreeREAC/reac-protocol.git 3713dca9969733abbd8032329a7d0eb979a67250
          git -C $RUNNER_TEMP/reac-protocol checkout -q FETCH_HEAD
      - name: Prepare the host for namespace tests
        run: |
          set -eux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          mods="veth dummy 8021q sch_etf"
          if ! sudo modprobe -a $mods; then
            sudo apt-get update -q
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
            sudo modprobe -a $mods
          fi
          lsmod | grep -E '^(veth|dummy|8021q|sch_etf) '
      - name: Build + unit tests, then the transport tests, in fedora:${{ matrix.fedora }}
        run: |
          docker run --rm --privileged -v "$GITHUB_WORKSPACE:/w" -v "$RUNNER_TEMP/reac-protocol:/reac-protocol:ro" -w /w fedora:${{ matrix.fedora }} bash -euxo pipefail -c '
            dnf install -y -q --setopt=install_weak_deps=False --setopt=retries=10 \
              gcc make python3 python3-pyyaml git iproute iproute-tc util-linux procps-ng libcap findutils diffutils gawk sed grep coreutils
            git config --global --add safe.directory "*"
            echo "fedora $(rpm -E %fedora), gcc $(gcc -dumpfullversion)"
            make test REAC_REQUIRE_FACTS_GATE=1 REAC_PROTOCOL=/reac-protocol
            make test-transport
            # This job exists to run the namespace tests: a test that exited 77 here did not run.
            tools/skip-gate.sh
          '

  # The package that carries fake_box for the programs that test against it (reac-pw): built the way the release
  # builds it, on each Fedora release the release builds for, and its file list is exactly the one binary, which
  # needs no libreac package to run.
  tests-package:
    name: tests-package (fedora ${{ matrix.fedora }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fedora: [44, 45]
    container: fedora:${{ matrix.fedora }}
    steps:
      - name: Install the build tools
        run: dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins gcc make tar gzip
      - uses: actions/checkout@v4
      - name: Build the RPMs
        run: |
          set -euo pipefail
          dnf builddep -y packaging/libreac.spec
          version=$(sed -n 's/^Version: *//p' packaging/libreac.spec)
          mkdir -p ~/rpmbuild/SOURCES
          tar --exclude=.git -czf ~/rpmbuild/SOURCES/libreac-$version.tar.gz --transform "s,^\.,libreac-$version," .
          rpmbuild -ba packaging/libreac.spec
      - name: libreac-tests carries fake_box and nothing else, and needs only libc
        run: |
          set -euo pipefail
          rpm=$(ls ~/rpmbuild/RPMS/*/libreac-tests-[0-9]*.rpm)
          rpm -qlp "$rpm" | grep -v -e '/\.build-id' -e '^/usr/lib$' | sort | tee files.txt
          printf '%s\n' /usr/libexec/libreac/tests/fake_box /usr/share/licenses/libreac-tests /usr/share/licenses/libreac-tests/LICENSE | sort > expected.txt
          diff -u expected.txt files.txt
          rpm -qp --requires "$rpm" | tee requires.txt
          ! grep -q '^libreac' requires.txt

  fuzz:
    runs-on: ubuntu-latest
    # A backstop: fuzz-run spends FUZZ_TIME on each harness and fuzz-sabotage at most
    # 30 s on each mutant, and fuzz-records builds each recorded mutant once, so the job ends on its own well inside this.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the fuzz harnesses (clang, libFuzzer, ASan, UBSan)
        run: make fuzz
      # Every parser of wire bytes, fuzzed from its seed corpus; red on any crash.
      - name: Fuzz each harness for 60 s
        run: make fuzz-run FUZZ_TIME=60
      # A harness that cannot find a planted bug finds nothing: each one-line mutant
      # in fuzz/sabotage/ must crash its harness.
      - name: Find every planted mutant
        run: make fuzz-sabotage
      # The seed corpus must keep reaching the parser lines it reaches today
      # (fuzz/coverage-floor.txt) and every property check of every harness.
      # llvm-cov and llvm-profdata must be clang's own LLVM.
      - name: Hold the coverage floor
        run: |
          v=$(clang -dumpversion | cut -d. -f1)
          cov=$(command -v llvm-cov-$v || command -v llvm-cov)
          prof=$(command -v llvm-profdata-$v || command -v llvm-profdata)
          make fuzz-cov LLVM_COV="$cov" LLVM_PROFDATA="$prof"
      # Every check's recorded breakage (the `mutant:` / `input:` lines in fuzz/*.c) must still apply
      # and be stopped by the seed it names: the records name source lines that move with every edit,
      # and a stale one proves nothing.
      - name: Hold every mutant record
        run: make fuzz-records
      # The committed seeds must be what fuzz/gen-corpus.c writes.
      - name: Hold the seed corpus to its generator
        run: make fuzz-corpus-check
      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz/findings/
          if-no-files-found: ignore
