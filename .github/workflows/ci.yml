name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    # A backstop only: every test already carries its own timeout (tests/run-test.sh),
    # so a hang reds its test in minutes instead of stalling the job for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build + unit tests
        run: make test
      # The transport suite, against the vendored reac-pw headers. Its namespace/veth test
      # either measures on this runner or exits 77 and is reported as SKIP: it ends with a
      # verdict either way, and every test in it carries tests/run-test.sh's timeout.
      - name: Transport tests
        run: make test-transport REACPW_INCLUDE=packaging/vendor/reac-pw-headers

  # The package that carries fake_box for the programs that test against it (reac-pw): built the way the release
  # builds it, and its file list is exactly the one binary, which needs no libreac package to run.
  tests-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: fedora:44
    steps:
      - name: Install the build tools
        run: dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins gcc make tar gzip
      - uses: actions/checkout@v4
      - name: Build the RPMs
        run: |
          set -euo pipefail
          dnf builddep -y packaging/libreac.spec
          version=$(sed -n 's/^Version: *//p' packaging/libreac.spec)
          mkdir -p ~/rpmbuild/SOURCES
          tar --exclude=.git -czf ~/rpmbuild/SOURCES/libreac-$version.tar.gz --transform "s,^\.,libreac-$version," .
          rpmbuild -ba packaging/libreac.spec
      - name: libreac-tests carries fake_box and nothing else, and needs only libc
        run: |
          set -euo pipefail
          rpm=$(ls ~/rpmbuild/RPMS/*/libreac-tests-[0-9]*.rpm)
          rpm -qlp "$rpm" | grep -v -e '/\.build-id' -e '^/usr/lib$' | sort | tee files.txt
          printf '%s\n' /usr/libexec/libreac/tests/fake_box /usr/share/licenses/libreac-tests /usr/share/licenses/libreac-tests/LICENSE | sort > expected.txt
          diff -u expected.txt files.txt
          rpm -qp --requires "$rpm" | tee requires.txt
          ! grep -q '^libreac' requires.txt

  fuzz:
    runs-on: ubuntu-latest
    # A backstop: fuzz-run spends FUZZ_TIME on each harness and fuzz-sabotage at most
    # 30 s on each mutant, so the job ends on its own well inside this.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the fuzz harnesses (clang, libFuzzer, ASan, UBSan)
        run: make fuzz
      # Every parser of wire bytes, fuzzed from its seed corpus; red on any crash.
      - name: Fuzz each harness for 60 s
        run: make fuzz-run FUZZ_TIME=60
      # A harness that cannot find a planted bug finds nothing: each one-line mutant
      # in fuzz/sabotage/ must crash its harness.
      - name: Find every planted mutant
        run: make fuzz-sabotage
      # The seed corpus must keep reaching the parser lines it reaches today
      # (fuzz/coverage-floor.txt). llvm-cov and llvm-profdata must be clang's own LLVM.
      - name: Hold the coverage floor
        run: |
          v=$(clang -dumpversion | cut -d. -f1)
          cov=$(command -v llvm-cov-$v || command -v llvm-cov)
          prof=$(command -v llvm-profdata-$v || command -v llvm-profdata)
          make fuzz-cov LLVM_COV="$cov" LLVM_PROFDATA="$prof"
      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz/findings/
          if-no-files-found: ignore
