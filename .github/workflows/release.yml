name: release

# Packages through the shared release workflows of FreeMixer/.github. A tag v<version> builds signed RPMs (Fedora 44, x86_64 and aarch64) and DEBs (Debian bookworm and
# trixie, amd64 and arm64), publishes them to the FreeMixer channel and attaches them to the GitHub
# release. Any other run, a pull request or a branch, is a dry run: it
# builds and lints everything and publishes nothing.
#
# libreac is a build dependency of reac-pw, so publish a libreac release before the reac-pw release
# that needs it.

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rpm:
    uses: FreeMixer/.github/.github/workflows/build-rpm.yml@main
    with:
      package-name: libreac
      binary-names: libreac libreac-devel libreac-transport libreac-transport-devel
      publish: ${{ github.ref_type == 'tag' }}
      needs-mod-host: false
      channel-deps: false
    secrets: inherit

  deb:
    uses: FreeMixer/.github/.github/workflows/build-deb.yml@main
    with:
      package-name: libreac
      binary-names: libreac6 libreac-dev libreac-transport7 libreac-transport-dev
      publish: ${{ github.ref_type == 'tag' }}
      dependencies: ''
      requires: ''
      channel-deps: false
    secrets: inherit
