name: release

# Packages through the shared release workflows of Open-Mixer/.github. A tag v<version> builds signed RPMs (Fedora 45, x86_64 and aarch64) and DEBs (Debian bookworm and
# trixie, amd64 and arm64), publishes them to the FreeREAC channel (FreeREAC/freereac.github.io, signed by its one key) and attaches them to the GitHub
# release. Any other run, a dispatch on a branch, is a dry run: it
# builds and lints everything and publishes nothing.
#
# libreac is a build dependency of reac-pw, so publish a libreac release before the reac-pw release
# that needs it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      same_pass:
        description: 'Packages other repositories release in the same pass, space separated: the channel-installability gate reports a range they fall outside of, instead of failing on it'
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  # The Debian library packages are named after the soname, which is the release version, so the
  # names the deb job publishes are read from the header and cannot lag a release.
  names:
    runs-on: ubuntu-latest
    outputs:
      deb: ${{ steps.n.outputs.deb }}
    steps:
      - uses: actions/checkout@v4
      - id: n
        run: |
          v=$(awk '/^#define LIBREAC_VERSION_(MAJOR|MINOR|PATCH)/ { v = v (v == "" ? "" : ".") $3 } END { print v }' include/reac/reac.h)
          echo "deb=libreac$v libreac-dev libreac-transport$v libreac-transport-dev" >> "$GITHUB_OUTPUT"

  # The packages other repositories release LATER in this same pass, for the channel-installability gate's same-pass
  # (a breakage they cause or suffer is reported, not red): a dispatch's same_pass input, else the tracked
  # .github/release-same-pass at the very commit this run builds (the tag on a push). One package per line or space
  # separated, # comments allowed. The file is reviewed like code and goes with its release; never a repository variable.
  samepass:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-same-pass
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          f=.github/release-same-pass
          [ -f "$f" ] || { echo "list=" >>"$GITHUB_OUTPUT"; echo "no $f at this commit: nothing released in the same pass"; exit 0; }
          names=$(sed -e 's/#.*//' "$f" | tr -s ' \t\r\n' '\n' | sed '/^$/d')
          for n in $names; do
            [[ "$n" =~ ^[a-z0-9][a-z0-9.+-]*$ ]] || { echo "::error::$f: '$n' is not a package name"; exit 1; }
          done
          list=$(echo $names)
          echo "list=$list" >>"$GITHUB_OUTPUT"
          echo "same pass from $f: ${list:-none}"

  rpm:
    needs: [samepass]
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      package-name: libreac
      target-repo: FreeREAC/freereac.github.io
      base-url: https://freereac.github.io
      release-package: freereac-release
      committed-keys: false
      signing-fingerprint: ${{ vars.FREEREAC_RELEASE_KEY_FPR }}
      key-file: RPM-GPG-KEY-freereac
      repo-file: packaging/freereac-release/freereac.repo
      binary-names: libreac libreac-devel libreac-transport libreac-transport-devel
      publish: ${{ github.ref_type == 'tag' }}
      same-pass: ${{ inputs.same_pass || needs.samepass.outputs.list }}
      needs-mod-host: false
      channel-deps: false
    secrets:
      OPENMIXER_PACKAGES_SIGNING_KEY: ${{ secrets.FREEREAC_PACKAGES_SIGNING_KEY }}
      PACKAGES_SIGNING_PASSPHRASE: ${{ secrets.FREEREAC_PACKAGES_SIGNING_PASSPHRASE }}
      PAGES_TOKEN: ${{ secrets.FREEREAC_PAGES_TOKEN }}
      SITE_GPG_KEY: ${{ secrets.OPENMIXER_CI_SIGNING_KEY }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

  # after the RPMs: a release is one wave. A red or skipped RPM job skips this one, so no DEB is published after a
  # failed RPM.
  deb:
    needs: [rpm, names, samepass]
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      package-name: libreac
      target-repo: FreeREAC/freereac.github.io
      base-url: https://freereac.github.io
      release-package: freereac-release
      committed-keys: false
      signing-fingerprint: ${{ vars.FREEREAC_RELEASE_KEY_FPR }}
      key-file: freereac.asc
      label: FreeREAC
      binary-names: ${{ needs.names.outputs.deb }}
      publish: ${{ github.ref_type == 'tag' }}
      same-pass: ${{ inputs.same_pass || needs.samepass.outputs.list }}
      dependencies: ''
      requires: ''
      channel-deps: false
    secrets:
      OPENMIXER_PACKAGES_SIGNING_KEY: ${{ secrets.FREEREAC_PACKAGES_SIGNING_KEY }}
      PACKAGES_SIGNING_PASSPHRASE: ${{ secrets.FREEREAC_PACKAGES_SIGNING_PASSPHRASE }}
      PAGES_TOKEN: ${{ secrets.FREEREAC_PAGES_TOKEN }}
      SITE_GPG_KEY: ${{ secrets.OPENMIXER_CI_SIGNING_KEY }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
