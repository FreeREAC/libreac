#
# Publish libreac into the SAME shared dnf tree FreeMixer/openmixer's own
# release-rpm.yml publishes into, and reac-pw's own equivalent workflow
# publishes into beside it. reac-pw's BuildRequires is `pkgconfig(libreac) >=
# 0.7.1` (packaging/reac-pw.spec) -- Fedora carries no such package -- so this
# is the workflow that has to run FIRST, before reac-pw's, or its `dnf
# builddep` fails loudly by name. Shaped after reac-pw's own file (read
# alongside it): this workflow calls packaging/publish-repo.sh unmodified,
# same as that one calls openmixer's -- a second copy of the placement/sign/
# createrepo logic would be a build whose drift nobody sees.
#
# workflow_dispatch ONLY, same reasons as openmixer's and reac-pw's: no push
# trigger, ever -- publishing a package is a human decision, not a side
# effect of a commit.
#
# THE SHARED-TREE RACE: openmixer's publisher, reac-pw's, and this one write
# into the SAME R2 bucket from THREE DIFFERENT REPOSITORIES. GitHub's
# `concurrency:` groups are scoped per-repository, so no group name here can
# serialise against either other repo's run -- a `sync --delete` racing
# another publisher could drop packages neither run meant to remove. The
# mitigation is structural, not locking: every sync in this workflow, both
# directions, OMITS --delete, and packaging/publish-repo.sh places files by
# NEVRA (identical package = no-op, a new one is ADDED, nothing already in
# the tree is ever removed). A true concurrent `createrepo_c --update` on the
# same directory from two runs at once is still possible and is not solved
# here -- publish a release, wait for it to land, then publish the next; the
# tag input already forces one dispatch to name one version.

name: Release libreac RPM to the dnf repo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (must already exist and match v[0-9]*, e.g. v0.7.1)'
        required: true
      sign:
        description: 'Sign the package and the repo metadata. false runs publish-repo.sh --no-sign for a dry run that publishes nothing.'
        type: boolean
        default: false

concurrency:
  # Serialises repeat dispatches of THIS workflow only -- see the race note
  # above for why it cannot reach across repositories.
  group: release-rpm-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Same variable name, same fallback shape and same meaning as openmixer's
  # and reac-pw's release-rpm.yml: the one shared tree, spelled once. An
  # unset repository variable changes nothing -- all three workflows fall
  # back the same way.
  OPENMIXER_REPO_BASEURL: ${{ vars.OPENMIXER_REPO_BASEURL || 'https://freemixer.github.io/rpm' }}
  # Same repo id and name as openmixer's and reac-pw's own runs, ON PURPOSE:
  # this is not a third repository beside the other two, it is packages
  # joining ONE dnf repo (one openmixer.repo, one GPG key, one repodata tree
  # per releasever/arch). A different id here would emit a second, colliding
  # .repo file over the same directory instead of adding entries to the one
  # dnf already trusts.
  OPENMIXER_REPO_ID: openmixer
  OPENMIXER_REPO_NAME: openmixer / FreeREAC

jobs:
  build:
    name: Build libreac RPM (fc44, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:44
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Refuse a tag that is not a RELEASE tag
        # Same glob openmixer's and reac-pw's build-rpm.sh enforce on their
        # own tags (RELEASE_TAG_GLOB='v[0-9]*'): a work marker becoming the
        # published version has already happened once (openmixer #370) and
        # RPM has no downgrade path. Refusing here names the reason before
        # any build runs.
        run: |
          set -eu
          case "$RELEASE_TAG" in
            v[0-9]*) echo "release tag: $RELEASE_TAG" ;;
            *) echo "::error::'$RELEASE_TAG' does not match the release-tag glob v[0-9]*"; exit 1 ;;
          esac

      # actions/checkout needs git INSIDE the container or it falls back to a tarball with no .git —
      # then `git describe` finds no repository. Install git before the checkout, as openmixer does.
      - name: git for the checkout
        run: dnf install -y -q git rsync # rsync: packaging/make-tarball.sh copies the source tree with it

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ env.RELEASE_TAG }}

      - name: Install build dependencies (dnf builddep against the spec)
        # libreac's own BuildRequires (gcc, make) are stock Fedora packages --
        # unlike reac-pw, nothing here needs a read-only view of the shared
        # tree, because libreac is the thing that FILLS pkgconfig(libreac),
        # not a consumer of it.
        run: |
          set -o pipefail
          dnf install -y --setopt=install_weak_deps=False git rpm-build rpmdevtools
          dnf builddep -y packaging/libreac.spec

      - name: Verify the tag resolves to the version this build will publish
        run: |
          set -o pipefail
          # The checkout is owned by a different uid than the container's shell;
          # without this git refuses the repository ("dubious ownership") and
          # `git describe` reports no tag at all.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git describe --tags --match 'v[0-9]*' || { echo '::error::git describe failed — see above'; exit 1; }

      - name: Build the libreac RPM
        # packaging/build-rpm.sh single-sources the version from
        # include/reac/reac.h unless passed one (make-tarball.sh refuses to
        # build a tarball when that header and packaging/libreac.spec
        # disagree); strip the leading v so the RPM Version: field never
        # carries it (rpm versions do not take a leading 'v').
        run: |
          set -o pipefail
          V="${RELEASE_TAG#v}"
          packaging/build-rpm.sh "$V"

      - name: Show what was built, and refuse an empty build
        run: |
          set -o pipefail
          TOP=$(readlink -f "${RPM_TOPDIR:-$HOME/rpmbuild}")
          find "$TOP/RPMS" "$TOP/SRPMS" -name '*.rpm' | sort | tee /tmp/built.txt
          # A publish step over an empty directory succeeds and publishes
          # nothing (false-signals #1: a search that finds nothing may be a
          # broken search) -- count before trusting the emptiness.
          test -s /tmp/built.txt || { echo "::error::no RPM was produced"; exit 1; }
          echo "RPM_TOPDIR=$TOP" >> "$GITHUB_ENV"

      # THE PACKAGES ARE PUBLIC, OR THEY ARE NOT PUBLISHED. A run artefact expires in
      # thirty days and needs a GitHub login to fetch; a Release asset does not. The dnf
      # tree above is the supported way to install, and this is the way that works with
      # nothing configured — `gh release download`, or a browser. Tag builds only, and it
      # is idempotent: --clobber replaces an asset the same tag already carries rather
      # than failing a re-run.
      - name: attach the packages to the release
        # A release is a dispatched TAG input (the tree publish runs the same way), not a
        # tag push: github.ref is the branch the workflow file came from.
        if: startsWith(inputs.tag, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # the build container is bare fedora: the GitHub CLI is a package there
          command -v gh >/dev/null || dnf install -y -q gh
          TAG="${RELEASE_TAG:-${{ inputs.tag }}}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          # Count before uploading: an empty glob would upload nothing and say nothing.
          # The build step's topdir is the container home's rpmbuild; RPM_TOPDIR is only set
          # when a caller overrides it, so look in both (measured: "no RPM to attach", 2026-09-09).
          find "${RPM_TOPDIR:-$HOME/rpmbuild}" /github/home/rpmbuild "$HOME/rpmbuild" -name '*.rpm' 2>/dev/null | sort -u | tee /tmp/assets.txt
          test -s /tmp/assets.txt || { echo "::error::no RPM to attach"; exit 1; }
          gh release upload "$TAG" --clobber $(cat /tmp/assets.txt | tr '\n' ' ')
          # and the source tarball the RPM was built from
          T=$(find "$RPM_TOPDIR/SOURCES" -name 'libreac-*.tar.gz' | head -1)
          [ -n "$T" ] && gh release upload "$TAG" --clobber "$T"
          echo "attached to $TAG:"; cat /tmp/assets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: libreac-rpm-fc44-x86_64
          path: |
            ${{ env.RPM_TOPDIR }}/RPMS/**/*.rpm
            ${{ env.RPM_TOPDIR }}/SRPMS/*.rpm
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Sign and publish into the shared dnf repo tree
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:44
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      # Signing is asked for, never assumed -- the default dispatch is a dry
      # run, same shape as openmixer's and reac-pw's own workflows.
      SIGN: ${{ inputs.sign }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Install packaging tools
        run: dnf install -y --setopt=install_weak_deps=False createrepo_c rpm-sign gnupg2 pinentry findutils

      - uses: actions/download-artifact@v4
        with:
          pattern: libreac-rpm-*
          merge-multiple: true
          path: collected/

      - name: Prove the artifacts arrived before anything signs them
        run: |
          set -o pipefail
          find collected -name '*.rpm' | sort | tee /tmp/collected.txt
          test -s /tmp/collected.txt || { echo "::error::no RPM was downloaded from the build job"; exit 1; }

      - name: Import the signing key
        if: env.SIGN == 'true'
        env:
          # Named, never valued -- the SAME key openmixer's and reac-pw's own
          # publishers sign with; a different signing key over one repo's
          # metadata would make repo_gpgcheck=1 fail for whichever half a
          # client fetches second, since only one gpgkey= line is baked into
          # the .repo file.
          GPG_KEY: ${{ secrets.RPM_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: |
          set -o pipefail
          test -n "$GPG_KEY" || { echo "::error::RPM_GPG_KEY is not set; a signed publish cannot proceed"; exit 1; }
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          test -n "$KEY_ID" || { echo "::error::no secret key imported from RPM_GPG_KEY"; exit 1; }
          echo "OMX_GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo 'allow-loopback-pinentry' >> ~/.gnupg/gpg-agent.conf
          echo 'pinentry-mode loopback'  >> ~/.gnupg/gpg.conf
          printf '%s' "$GPG_PASSPHRASE" > ~/.gnupg/passphrase
          chmod 600 ~/.gnupg/passphrase
          echo "passphrase-file $HOME/.gnupg/passphrase" >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true

      - name: Pull the current shared tree
        # Fedora ships no pip and no aws on PATH -- awscli2 is a package
        # (learned building openmixer's own version of this step). Only
        # rpm/ is pulled: it is the whole tree publish-repo.sh's --out
        # produces and the only prefix this job writes back to.
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -o pipefail
          command -v aws >/dev/null || dnf install -y -q awscli2
          mkdir -p tree/rpm
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET" ]; then
            AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
              aws s3 sync "s3://$R2_BUCKET/rpm/" tree/rpm/ \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            # The pulled metadata is discarded: the assembly below regenerates it from the
            # package bytes actually in the tree, so a checksum can never describe a package
            # this run did not push (createrepo_c --update would trust a same-size, same-mtime
            # entry it has no reason to doubt).
            find tree/rpm -type d -name repodata -prune -exec rm -rf {} +
            echo "PULLED_TREE=1" >> "$GITHUB_ENV"
          else
            echo "::warning::R2 write credentials are not set -- publishing into an EMPTY local tree."
            echo "The result below adds libreac to a tree with nothing else in it, and the push"
            echo "step further down will not run (SIGN=$SIGN, and it never runs unsigned anyway)."
            echo "PULLED_TREE=0" >> "$GITHUB_ENV"
          fi

      - name: Assemble the tree (merge libreac in, never clobber what is there)
        env:
          OPENMIXER_REPO_READ_USERNAME: ${{ secrets.OPENMIXER_REPO_READ_USERNAME }}
          OPENMIXER_REPO_READ_PASSWORD: ${{ secrets.OPENMIXER_REPO_READ_PASSWORD }}
        run: |
          set -o pipefail
          args=(--rpm-dir collected --out tree
                --repo-id "$OPENMIXER_REPO_ID"
                --repo-name "$OPENMIXER_REPO_NAME"
                --base-url "$OPENMIXER_REPO_BASEURL")
          if [ "$SIGN" = "true" ]; then
            args+=(--key-id "$OMX_GPG_KEY_ID")
          else
            args+=(--no-sign)
          fi
          if [ -n "$OPENMIXER_REPO_READ_USERNAME" ]; then
            args+=(--repo-username "$OPENMIXER_REPO_READ_USERNAME" --repo-password "$OPENMIXER_REPO_READ_PASSWORD")
          fi
          # This is openmixer's own script, called unmodified (see the file
          # header): it places by NEVRA (an unchanged package is a no-op),
          # signs only what is new, and runs createrepo_c --update over any
          # directory it touches -- so a tree that already carries
          # openmixer's and reac-pw's packages keeps them, and the repodata
          # that comes out DESCRIBES ALL THREE.
          packaging/publish-repo.sh "${args[@]}"

      - name: Show what was published
        run: |
          set -o pipefail
          echo "libreac packages in the tree:"
          find tree/rpm -name 'libreac-*.rpm' -o -name 'libreac-*.src.rpm' | sort
          echo
          echo "every package now in the tree (libreac's addition should be new here):"
          find tree/rpm/fedora -name '*.rpm' | sort
          echo
          echo "repodata timestamps:"
          find tree/rpm -name repomd.xml -newer packaging/build-rpm.sh -o -name repomd.xml | sort | xargs -r ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: libreac-dnf-tree
          path: tree/**
          if-no-files-found: error
          retention-days: 30

      - name: Push only the changed files back (never --delete)
        # Deletion belongs to nobody's automated sync here: a stray --delete
        # would be able to remove openmixer's or reac-pw's own packages the
        # instant this tree diverges from what this job happened to pull a
        # few minutes earlier (see the race note at the top of the file).
        # --size-only avoids re-uploading every byte-identical package this
        # run did not touch (their local mtime is "now", from the pull, so a
        # plain sync would otherwise treat all of them as changed) while
        # still catching the files that DID change: repomd.xml, its .asc,
        # and the .repo/key.
        if: env.SIGN == 'true' && env.PULLED_TREE == '1'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -o pipefail
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync tree/rpm/ "s3://$R2_BUCKET/rpm/" --size-only --endpoint-url "$EP"
          # --size-only cannot see a re-signed repomd.xml.asc (same byte count, new bytes) or a
          # same-size repomd.xml, and a stale signature over new metadata is "Bad PGP signature"
          # for every consumer (measured 2026-09-09). Metadata and the tree's top-level files are
          # therefore always overwritten; package files are never re-uploaded.
          find tree/rpm -type d -name repodata | while read -r d; do
            aws s3 cp --recursive "$d" "s3://$R2_BUCKET/${d#tree/}" --endpoint-url "$EP"
          done
          find tree/rpm -maxdepth 1 -type f \( -name '*.repo' -o -name 'RPM-GPG-KEY-*' \) | while read -r f; do
            aws s3 cp "$f" "s3://$R2_BUCKET/${f#tree/}" --endpoint-url "$EP"
          done
          echo "pushed tree/rpm/ to s3://$R2_BUCKET/rpm/ (size-only, no --delete)"

      - name: Report an unsigned or unpushed run honestly
        if: env.SIGN != 'true' || env.PULLED_TREE != '1'
        # WARNS and exits 0, same reasoning as openmixer's and reac-pw's own
        # equivalent steps: the build and the tree assembly both did real
        # work (the artifact above is the proof), and this step exists so
        # the run never CLAIMS to have published when it did not.
        run: |
          echo "::warning::nothing was pushed to the shared tree."
          if [ "$SIGN" != "true" ]; then
            echo "sign=false (the default): this is a dry run. publish-repo.sh --no-sign emits"
            echo "repo_gpgcheck=0, and pushing that tree would make a client trust unverified metadata."
          fi
          if [ "$PULLED_TREE" != "1" ]; then
            echo "R2 write credentials were not set, so the local tree assembled above has nothing"
            echo "of openmixer's or reac-pw's in it either -- pushing it would have clobbered the real one."
          fi
          echo "the assembled tree is attached to this run as 'libreac-dnf-tree' for inspection."
